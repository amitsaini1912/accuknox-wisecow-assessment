name: Wisecow CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wisecow
jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scripts/requirements.txt && pytest -q tests

  build-push:
    needs: script-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke test image
        run: |
          docker run -d --name wc -p 4499:4499 ${{ env.IMAGE }}:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:4499 | grep -q "<pre>"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Install ingress-nginx and cert-manager
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=180s
      - name: Build image and load into kind
        run: |
          docker build -t wisecow:ci .
          kind load docker-image wisecow:ci --name chart-testing
      - name: Deploy wisecow
        run: |
          sed -i "s|ghcr.io/amitsaini1912/wisecow:latest|wisecow:ci|; s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deploy/wisecow --timeout=120s
      - name: Verify service and TLS secret
        run: |
          kubectl get pods,svc,ingress
          kubectl wait --for=condition=Ready certificate/wisecow-tls --timeout=120s
          kubectl port-forward svc/wisecow-svc 8080:80 & sleep 3
          curl -sf http://localhost:8080 | grep -q "<pre>"
