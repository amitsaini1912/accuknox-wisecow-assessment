apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels: {app: wisecow}
spec:
  replicas: 2
  selector:
    matchLabels: {app: wisecow}
  template:
    metadata:
      labels: {app: wisecow}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: wisecow
          image: ghcr.io/amitsaini1912/wisecow:latest
          imagePullPolicy: Always
          ports: [{containerPort: 4499}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {tcpSocket: {port: 4499}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 4499}, initialDelaySeconds: 10, periodSeconds: 10}
